# Anonieme transcriptie-webapp — één VM, opschaalbaar naar meer workers / GPU-node.
#
# Schaal-as: `docker compose up -d --scale worker=3` zet meer STT/LLM-workers bij.
# Voor productie-TLS: zie Caddyfile (automatische certificaten met een domeinnaam).

services:
  # Frontend + reverse proxy (static files + /api -> api)
  web:
    image: caddy:2-alpine
    depends_on: [api]
    environment:
      # Domein + TLS-modus voor Caddy (zie Caddyfile).
      # Lokaal/intern: SITE_ADDRESS=jouw-host.local, CADDY_TLS=internal (self-signed)
      # Prod: SITE_ADDRESS=transcriptie.jouwdomein.nl, CADDY_TLS=jij@jouwdomein.nl (ACME)
      SITE_ADDRESS: "${SITE_ADDRESS:-localhost}"
      CADDY_TLS: "${CADDY_TLS:-internal}"
      # Certificaat voor SNI-loze verbindingen (IP-toegang). Zet op je hoofd-hostnaam.
      DEFAULT_SNI: "${DEFAULT_SNI:-localhost}"
      # Optioneel subpad als de app achter een reverse-proxy op bv. /transcriptie draait
      # en die proxy het prefix NIET strip't. Niet gezet/leeg = web-root (standaard): dan
      # geven we een sentinel-prefix door dat nooit matcht, zodat Caddy's strip een no-op is.
      # Zet BASE_PATH=/transcriptie om het subpad te activeren. Zie Caddyfile/DEPLOY.md.
      BASE_PATH: "${BASE_PATH:-/__no_base_path__}"
    ports:
      # Poorten configureerbaar zodat je naast een bestaande reverse-proxy kunt draaien.
      # Draait er al een Caddy/nginx op 80/443? Zet WEB_HTTP_PORT/WEB_HTTPS_PORT op vrije
      # poorten (bv. 8080/8443) én WEB_BIND=127.0.0.1: zodat de app-Caddy alleen lokaal
      # luistert; laat je bestaande proxy daar dan naartoe reverse_proxien. Zie DEPLOY.md.
      - "${WEB_BIND:-}${WEB_HTTP_PORT:-80}:80"     # http -> https redirect
      - "${WEB_BIND:-}${WEB_HTTPS_PORT:-443}:443"  # https
    volumes:
      - ./frontend:/srv:ro
      # Handleiding/quickref + hun screenshots/fonts serveren onder /docs (voor de
      # "Handleiding"-knop). Caddy strip't het /docs-prefix; relatieve verwijzingen
      # in de HTML lossen dan correct op.
      - ./docs:/srv-docs:ro
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      # Eigen certificaat gebruiken (geen browserwaarschuwing): leg cert+key in ./certs
      # en zet CADDY_TLS="/certs/cert.pem /certs/key.pem". Zie deploy/DEPLOY.md.
      - ./certs:/certs:ro
    restart: unless-stopped

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes:
      - audiodata:/data
      - ./PROMPTS.md:/app/PROMPTS.md:ro
    restart: unless-stopped

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
      args:
        # GPU-libs voor faster-whisper/CTranslate2 (cuBLAS/cuDNN). Default AAN;
        # zet STT_GPU=0 voor een CPU-only image.
        STT_GPU: "${STT_GPU:-1}"
        # Canary/NeMo is zwaar en losgekoppeld van de standaard-build: default UIT.
        # Zet INSTALL_NEMO=1 alleen als je STT_BACKEND=canary wilt draaien.
        # TORCH_VARIANT: "default" (nieuwe GPU's) of "cu124" (Tesla V100/Volta).
        INSTALL_NEMO: "${INSTALL_NEMO:-0}"
        TORCH_VARIANT: "${TORCH_VARIANT:-default}"
    env_file: .env
    environment:
      # Beperkt VRAM-fragmentatie bij GPU-runs op krappe/gedeelde kaarten.
      PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    # Bereik het bestaande Qwen-endpoint dat op de HOST draait (LLM_BASE_URL kan
    # dan http://host.docker.internal:8033/v1 gebruiken).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - audiodata:/data
      - ./PROMPTS.md:/app/PROMPTS.md:ro
      - hf_cache:/root/.cache        # model-cache (faster-whisper / HF / NeMo)
    restart: unless-stopped
    # --- GPU via CDI (geen nvidia-runtime registratie / daemon-restart nodig) ---
    # WORKER_GPU_DEVICE kiest de GPU (CDI): "nvidia.com/gpu=all", of een index
    # "nvidia.com/gpu=0". install.sh zet dit in .env.
    devices:
      - "${WORKER_GPU_DEVICE:-nvidia.com/gpu=all}"

  cleanup:
    build:
      context: ./backend
      dockerfile: Dockerfile.api
    command: ["python", "-m", "cleanup.cleanup"]
    env_file: .env
    depends_on:
      db: { condition: service_healthy }
    volumes:
      - audiodata:/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: transcribe
      POSTGRES_PASSWORD: transcribe
      POSTGRES_DB: transcribe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcribe"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
  audiodata:
  caddy_data:
  hf_cache:
